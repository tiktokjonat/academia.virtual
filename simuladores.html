<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Geincos Admin | Gestión de Simuladores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --primary: #4f46e5; --bg-body: #f3f4f6; --surface: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; flex-shrink: 0; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .brand span { font-size: 1.25rem; font-weight: 800; color: var(--text-main); }
        .menu-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin: 20px 0 10px 10px; }
        .menu-item { padding: 12px 16px; color: var(--text-muted); border-radius: 8px; cursor: pointer; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 500; }
        .menu-item:hover { background: #eef2ff; color: var(--primary); }
        .menu-item.active { background: var(--primary); color: white; }

        .main-content { flex: 1; padding: 32px; overflow-y: auto; display: flex; flex-direction: column; height: 100vh; }
        .header { display: flex; justify-content: space-between; margin-bottom: 25px; align-items: center; }
        h2 { font-size: 1.8rem; font-weight: 700; }

        /* GRID DE CARPETAS */
        .grid-folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .folder-card { background: white; padding: 25px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; transition: 0.3s; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .folder-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .folder-icon { font-size: 3rem; color: #ec4899; margin-bottom: 15px; }
        .folder-name { font-weight: 800; color: var(--text-main); font-size: 1rem; }

        /* VISTA DETALLE */
        .table-container { background: white; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px 20px; background: #f8fafc; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        td { padding: 15px 20px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        
        .btn-primary { background: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .btn-back { background: #f1f5f9; color: var(--text-muted); padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; margin-bottom: 20px; font-weight: 600; }
        .btn-icon { width: 32px; height: 32px; border-radius: 6px; border: none; cursor: pointer; color: white; margin-right: 5px; }

        /* EDITOR */
        .sim-editor-view { display: none; flex-direction: column; gap: 20px; }
        .step-card { border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 15px; background: #f8fafc; position: relative; }
        .step-card h4 { margin: 0 0 15px 0; color: var(--primary); font-size: 1rem; }
        .delete-step { position: absolute; top: 15px; right: 15px; color: var(--danger); cursor: pointer; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><span>Geincos Admin</span></div>
        <div class="menu-label">Gestión</div>
        <a href="postulantes.html" class="menu-item"><i class="fas fa-users"></i> Postulantes</a>
        <a href="personal-activo.html" class="menu-item"><i class="fas fa-id-badge"></i> Personal Activo</a>
        <a href="asistencia.html" class="menu-item"><i class="fas fa-calendar-check"></i> Asistencia</a>
        <a href="materiales.html" class="menu-item"><i class="fas fa-book"></i> Materiales</a>
        <a href="examenes.html" class="menu-item"><i class="fas fa-clipboard-check"></i> Exámenes</a>
        <a href="simuladores.html" class="menu-item active"><i class="fas fa-gamepad"></i> Simuladores</a>
        <a href="ia-roleplay.html" class="menu-item"><i class="fas fa-robot"></i> IA Roleplay</a>
        <div class="menu-item" style="margin-top:auto; color:var(--danger)" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</div>
    </div>

    <div class="main-content">
        <div id="sectionFolders">
            <div class="header">
                <h2>Módulos de Simulación</h2>
                <button class="btn-primary" onclick="createNewSim()">+ Nuevo Simulador</button>
            </div>
            <div id="viewModuleFolders" class="grid-folders"></div>
        </div>

        <div id="viewSimsDetail" style="display:none">
            <button class="btn-back" onclick="showFolders()"><i class="fas fa-arrow-left"></i> Volver a Módulos</button>
            <div class="header"><h2 id="moduleTitle">Simuladores</h2></div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Título</th><th>Descripción</th><th>Acciones</th></tr></thead>
                    <tbody id="tbSims"></tbody>
                </table>
            </div>
        </div>

        <div id="sectionEditor" class="sim-editor-view">
            <div class="header">
                <h2 id="editorTitle">Editor</h2>
                <div style="display:flex; gap:10px">
                    <button class="btn-primary" style="background:#64748b" onclick="cancelEdit()">Cancelar</button>
                    <button class="btn-primary" onclick="saveSim()">Guardar Cambios</button>
                </div>
            </div>
            <div style="background:white; padding:25px; border-radius:20px; border:1px solid var(--border)">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px">
                    <div><label>Título</label><input id="simTitle" class="form-control"></div>
                    <div><label>Módulo</label><input id="simMod" class="form-control"></div>
                </div>
                <div class="form-group"><label>Descripción Corta</label><input id="simDesc" class="form-control"></div>
                <h3 style="margin:25px 0 15px 0">Configuración de Pasos</h3>
                <div id="stepsContainer"></div>
                <button class="btn-primary" style="margin:20px auto; display:flex" onclick="addStep()">+ Agregar Paso</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://xgvfcmadsprjyljtpooo.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndmZjbWFkc3ByanlsanRwb29vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1ODMxNjAsImV4cCI6MjA4MjE1OTE2MH0.XYBbKFE17PfyYMn2SNL5UJrCQmDRbimTQO0jpbX1Zd0';
        const sbClient = supabase.createClient(SB_URL, SB_KEY);

        let simModules = {}, editorSteps = [], currentSimId = null, currentFolder = null;

        window.onload = loadSimData;

        async function loadSimData() {
            const { data } = await sbClient.from('cursos').select('*').eq('tipo', 'simulador').order('modulo');
            simModules = {};
            if(data) {
                data.forEach(s => {
                    const mod = s.modulo || 'General';
                    if(!simModules[mod]) simModules[mod] = [];
                    simModules[mod].push(s);
                });
            }
            renderFolders();
        }

        function renderFolders() {
            let h = '';
            for(let mod in simModules) {
                h += `<div class="folder-card" onclick="openModule('${mod}')">
                        <i class="fas fa-folder folder-icon"></i>
                        <div class="folder-name">${mod}</div>
                        <div style="font-size:0.8rem; color:var(--text-muted); margin-top:5px">${simModules[mod].length} Simuladores</div>
                    </div>`;
            }
            document.getElementById('viewModuleFolders').innerHTML = h || '<p style="text-align:center; grid-column:1/-1; padding:40px; color:#999">Sin datos.</p>';
            document.getElementById('sectionFolders').style.display = 'block';
            document.getElementById('viewSimsDetail').style.display = 'none';
            document.getElementById('sectionEditor').style.display = 'none';
        }

        function openModule(mod) {
            currentFolder = mod;
            document.getElementById('sectionFolders').style.display = 'none';
            document.getElementById('viewSimsDetail').style.display = 'block';
            document.getElementById('sectionEditor').style.display = 'none';
            document.getElementById('moduleTitle').innerText = `Simuladores: ${mod}`;
            
            let h = '';
            simModules[mod].forEach(s => {
                h += `<tr>
                    <td><b>${s.titulo}</b></td>
                    <td style="color:var(--text-muted)">${s.descripcion || '-'}</td>
                    <td>
                        <button class="btn-icon" style="background:var(--warning)" onclick="editSim('${s.id}')"><i class="fas fa-pen"></i></button>
                        <button class="btn-icon" style="background:var(--danger)" onclick="delSim('${s.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            });
            document.getElementById('tbSims').innerHTML = h;
        }

        function showFolders() { loadSimData(); }
        function logout() { localStorage.clear(); window.location.href='index.html'; }

        function createNewSim() {
            currentSimId = null;
            editorSteps = [{cliente: "Hola...", opciones: ["Opción A"], correcta: 0}];
            document.getElementById('simTitle').value = '';
            document.getElementById('simMod').value = currentFolder || 'General';
            document.getElementById('simDesc').value = '';
            showEditor("Nuevo Escenario");
        }

        async function editSim(id) {
            const { data } = await sbClient.from('cursos').select('*').eq('id', id).single();
            currentSimId = id;
            document.getElementById('simTitle').value = data.titulo;
            document.getElementById('simMod').value = data.modulo;
            document.getElementById('simDesc').value = data.descripcion;
            editorSteps = JSON.parse(data.data_juego);
            showEditor("Editando: " + data.titulo);
        }

        function showEditor(title) {
            document.getElementById('editorTitle').innerText = title;
            document.getElementById('sectionFolders').style.display = 'none';
            document.getElementById('viewSimsDetail').style.display = 'none';
            document.getElementById('sectionEditor').style.display = 'flex';
            renderSteps();
        }

        // FUNCIÓN CORREGIDA PARA EVITAR DESORDEN
        function cancelEdit() {
            document.getElementById('sectionEditor').style.display = 'none';
            if(currentFolder) {
                document.getElementById('viewSimsDetail').style.display = 'block';
            } else {
                document.getElementById('sectionFolders').style.display = 'block';
            }
        }

        function renderSteps() {
            let h = '';
            editorSteps.forEach((s, i) => {
                let optsHtml = '';
                s.opciones.forEach((opt, j) => {
                    optsHtml += `<div style="display:flex; gap:10px; margin-bottom:8px; align-items:center">
                        <input type="radio" name="corr${i}" ${s.correcta == j ? 'checked' : ''} onclick="updateStep(${i},'correcta',${j})">
                        <input class="form-control" style="margin:0" value="${opt}" oninput="updateOpt(${i},${j},this.value)" placeholder="Opción ${j+1}">
                        <button class="btn-icon" style="background:var(--danger); width:28px; height:28px" onclick="removeOpt(${i},${j})"><i class="fas fa-times"></i></button>
                    </div>`;
                });
                h += `<div class="step-card">
                    <h4>Paso ${i + 1}</h4>
                    <i class="fas fa-trash delete-step" onclick="removeStep(${i})"></i>
                    <div class="form-group"><label>Cliente dice:</label><input class="form-control" value="${s.cliente}" oninput="updateStep(${i}, 'cliente', this.value)"></div>
                    <div class="form-group"><label>Respuestas:</label>${optsHtml}
                    <button style="width:100%; border:1px dashed var(--primary); background:none; color:var(--primary); padding:8px; border-radius:8px; cursor:pointer" onclick="addOpt(${i})">+ Opción</button></div>
                </div>`;
            });
            document.getElementById('stepsContainer').innerHTML = h;
        }

        function addStep() { editorSteps.push({cliente: "...", opciones: [""], correcta: 0}); renderSteps(); }
        function removeStep(i) { if(editorSteps.length > 1) { editorSteps.splice(i, 1); renderSteps(); } }
        function updateStep(i, f, v) { editorSteps[i][f] = v; }
        function updateOpt(i, j, v) { editorSteps[i].opciones[j] = v; }
        function addOpt(i) { editorSteps[i].opciones.push(""); renderSteps(); }
        function removeOpt(i, j) { if(editorSteps[i].opciones.length > 1) { editorSteps[i].opciones.splice(j, 1); renderSteps(); } }

        async function saveSim() {
            const payload = {
                titulo: document.getElementById('simTitle').value,
                modulo: document.getElementById('simMod').value,
                descripcion: document.getElementById('simDesc').value,
                tipo: 'simulador', data_juego: JSON.stringify(editorSteps), categoria: 'General'
            };
            if(currentSimId) await sbClient.from('cursos').update(payload).eq('id', currentSimId);
            else await sbClient.from('cursos').insert([payload]);
            alert('Guardado');
            loadSimData();
        }

        async function delSim(id) { if(confirm('¿Eliminar?')) { await sbClient.from('cursos').delete().eq('id', id); loadSimData(); } }
    </script>
</body>
</html>
