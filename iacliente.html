<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simulador | Geincos Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{ --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --primary:#ec4899; --secondary:#3b82f6; --success:#10b981; --danger:#ef4444; --warning:#f59e0b; }
  *{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
  body{margin:0;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  
  /* HEADER */
  .header{padding:15px 25px;background:var(--card);border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}
  .back-btn{color:#cbd5e1;text-decoration:none;display:flex;align-items:center;gap:8px;font-weight:600;transition:.2s}
  .back-btn:hover{color:var(--primary)}
  .btn-finish{background:var(--danger);color:white;border:none;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer;transition:.3s}
  .btn-finish:hover{background:#dc2626}

  /* LAYOUT */
  .main-container{display:flex;flex:1;height:calc(100vh - 70px)}
  
  /* LEFT PANEL (CRM) */
  .crm-panel{width:380px;background:var(--card);border-right:1px solid #334155;padding:25px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
  .client-card{background:#334155;padding:20px;border-radius:16px;border:1px solid #475569}
  .client-avatar{width:70px;height:70px;background:#475569;border-radius:50%;margin:0 auto 15px;display:flex;justify-content:center;align-items:center;font-size:1.8rem}
  .data-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:0.9rem;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:4px}
  .data-label{color:#94a3b8} .data-val{font-weight:700;color:white;text-align:right}
  
  .crm-form label{display:block;margin-bottom:5px;font-size:0.85rem;color:#cbd5e1}
  .crm-input{width:100%;padding:10px;background:#0f172a;border:1px solid #475569;color:white;border-radius:8px;margin-bottom:15px}
  .crm-input:focus{border-color:var(--primary);outline:none}

  /* RIGHT PANEL (CHAT) */
  .chat-panel{flex:1;display:flex;flex-direction:column;background:radial-gradient(circle at center,#1e293b 0%,#0f172a 100%);position:relative}
  .chat-area{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:15px}
  .msg{max-width:80%;padding:12px 16px;border-radius:12px;font-size:0.95rem;line-height:1.5;position:relative}
  .msg.asesor{align-self:flex-end;background:var(--secondary);color:white;border-bottom-right-radius:2px}
  .msg.cliente{align-self:flex-start;background:#334155;color:#e2e8f0;border-bottom-left-radius:2px}
  .bp-badge{position:absolute;top:-8px;right:10px;background:#f59e0b;color:black;font-size:0.65rem;padding:2px 6px;border-radius:10px;font-weight:800;z-index:1}

  /* CONTROLS */
  .controls{padding:20px;background:var(--card);border-top:1px solid #334155;display:flex;justify-content:center;gap:20px;align-items:center}
  .mic-btn{width:70px;height:70px;border-radius:50%;background:var(--primary);border:none;color:white;font-size:1.8rem;cursor:pointer;box-shadow:0 0 20px rgba(236,72,153,0.4);transition:.3s;display:flex;justify-content:center;align-items:center}
  .mic-btn:hover{transform:scale(1.1)}
  .mic-btn.active{background:#ef4444;animation:pulse 1.5s infinite}
  .status-text{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);padding:5px 15px;border-radius:20px;font-size:0.9rem;pointer-events:none}

  /* MODAL FEEDBACK */
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:2000;display:none;justify-content:center;align-items:center}
  .modal-content{background:white;color:#1e293b;width:90%;max-width:800px;max-height:90vh;overflow-y:auto;border-radius:20px;padding:30px}
  .score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:20px}
  .score-card{background:#f1f5f9;padding:15px;border-radius:10px;text-align:center}
  .score-val{font-size:1.5rem;font-weight:800;color:var(--primary)}
  .fb-list { list-style: none; padding: 0; }
  .fb-list li { padding: 8px 12px; margin-bottom: 8px; border-radius: 8px; font-size: 0.95rem; }
  .fb-good li { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  .fb-bad li { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,0.7)}70%{box-shadow:0 0 0 20px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
</style>
</head>
<body>
  <div class="header">
    <a href="panel-usuario.html" class="back-btn"><i class="fas fa-arrow-left"></i> Volver</a>
    <h3 id="scTitle" style="margin:0">Cargando...</h3>
    <button class="btn-finish" onclick="finishSession()">Terminar y Evaluar</button>
  </div>

  <div class="main-container">
    <div class="crm-panel">
      <div class="client-card">
        <div class="client-avatar"><i class="fas fa-user"></i></div>
        <h3 id="cName" style="text-align:center;margin:0 0 15px 0">...</h3>
        <div class="data-row"><span class="data-label">DNI</span><span class="data-val" id="cDni">...</span></div>
        <div class="data-row"><span class="data-label">Producto</span><span class="data-val" id="cProd">...</span></div>
        <div class="data-row"><span class="data-label">Deuda Total</span><span class="data-val" style="color:#ef4444" id="cDeuda">...</span></div>
        <div class="data-row"><span class="data-label">Capital</span><span class="data-val" id="cCapital">...</span></div> <div class="data-row"><span class="data-label">Mora</span><span class="data-val" id="cMora">...</span></div>
        <div class="data-row"><span class="data-label">Campaña</span><span class="data-val" style="color:#f59e0b" id="cCamp">...</span></div>
      </div>

      <div class="crm-form">
        <h4>Gestión de la Llamada</h4>
        <label>Teléfono Marcado</label>
        <select class="crm-input"><option>99***123 (Titular)</option><option>98***456 (Casa)</option></select>
        
        <label>Resultado</label>
        <select class="crm-input" id="resLlamada">
            <option value="">-- Seleccionar --</option>
            <option value="promesa">Promesa de Pago</option>
            <option value="no_contacto">No Contacto</option>
            <option value="rechazo">Rechazo / Renuente</option>
            <option value="tercero">Tercero</option>
        </select>

        <label>Observaciones</label>
        <textarea class="crm-input" rows="4" placeholder="Detalle de la gestión..."></textarea>
      </div>
    </div>

    <div class="chat-panel">
      <div class="status-text" id="statusText">Presiona el micrófono para hablar</div>
      <div class="chat-area" id="chatBox"></div>
      <div class="controls">
        <button class="mic-btn" id="btnMic" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
      </div>
    </div>
  </div>

  <div class="modal" id="modalFeedback">
    <div class="modal-content">
      <h2 style="margin-top:0">Resultado de la Simulación</h2>
      <div id="fbContent">Cargando...</div>
      <div style="margin-top:20px;text-align:right">
        <button class="btn-finish" style="background:#64748b" onclick="window.location.href='panel-usuario.html'">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    /* CONFIGURACIÓN Y LÓGICA CORE */
    const SB_URL = 'https://xgvfcmadsprjyljtpooo.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndmZjbWFkc3ByanlsanRwb29vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1ODMxNjAsImV4cCI6MjA4MjE1OTE2MH0.XYBbKFE17PfyYMn2SNL5UJrCQmDRbimTQO0jpbX1Zd0';
    const sbClient = supabase.createClient(SB_URL, SB_KEY);
    const user = localStorage.getItem('usuarioActual') || 'Anonimo';
    
    let scenarioData = null, apiKeys = [], currentKeyIdx = 0;
    let recognition, isListening = false, conversationHistory = [];
    let fullTranscriptAsesor = [], fullTranscriptCliente = [];

    // PUNTOS DE QUIEBRE
    const RX_BP={
        askMonto:/(cu[aá]nt[oa].{0,20}(tiene|puede).{0,20}(pagar|abonar)|monto.{0,15}pagar|con\s*cu[aá]nto.{0,15}pagar|cu[aá]nto.{0,15}cancelar)/i,
        capital:/capital/i, cuotas:/cuota/i, camp:/campan(a|o)|campaña|descuento/i, abono:/abono|propuesta/i,
        urg:/\bhoy\b|(?:24|48|72)\s*h/i, cierreCliente:/\b(acepto|de acuerdo|ok\s*(pago|va)|voy a pagar|sí pago|si pago|puedo pagar hoy|cancelar[ée]?|lo hago hoy)\b/i
    };

    window.onload = async () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if(!id) return alert("Error: Falta ID escenario");

        const { data, error } = await sbClient.from('roleplay_scenarios').select('*').eq('id', id).single();
        if(error || !data) return alert("Escenario no encontrado");

        scenarioData = data;
        apiKeys = data.api_keys || [];
        if(apiKeys.length === 0) alert("AVISO: El admin no ha configurado API Keys. La IA no responderá.");

        // UI Setup
        document.getElementById('scTitle').innerText = data.titulo;
        const cli = data.datos_cliente || {};
        document.getElementById('cName').innerText = cli.nombre || 'Cliente';
        document.getElementById('cProd').innerText = cli.producto || '-';
        document.getElementById('cDeuda').innerText = 'S/ ' + (cli.deuda || '0');
        
        // MOSTRAR CAPITAL
        document.getElementById('cCapital').innerText = 'S/ ' + (cli.capital || cli.mcap || '0'); 
        
        document.getElementById('cMora').innerText = cli.mora || '0 días';
        document.getElementById('cCamp').innerText = cli.campana || '-';
        document.getElementById('cDni').innerText = Math.floor(Math.random()*80000000) + 10000000;

        // Init Prompt
        conversationHistory = [
            { role: "system", content: data.prompt_sistema + " (Responde como el cliente, breve y natural. No uses guiones)." }
        ];

        setupVoice();
    };

    function setupVoice() {
        if (!('webkitSpeechRecognition' in window)) return alert("Usa Chrome para este simulador.");
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onstart = () => { isListening = true; updateMicUI(true); };
        recognition.onend = () => { isListening = false; updateMicUI(false); };
        recognition.onresult = (event) => {
            const last = event.results.length - 1;
            const text = event.results[last][0].transcript;
            if(text.trim()) processAsesorInput(text);
        };
    }

    function toggleMic() {
        if(isListening) recognition.stop();
        else recognition.start();
    }

    function updateMicUI(active) {
        const btn = document.getElementById('btnMic');
        const txt = document.getElementById('statusText');
        if(active) { btn.classList.add('active'); txt.innerText = "Escuchando..."; }
        else { btn.classList.remove('active'); txt.innerText = "Presiona para hablar"; }
    }

    async function processAsesorInput(text) {
        addMessage('asesor', text);
        fullTranscriptAsesor.push(text);
        conversationHistory.push({ role: "user", content: text });
        
        // IA Response
        document.getElementById('statusText').innerText = "Cliente pensando...";
        const aiResponse = await fetchOpenAI(conversationHistory);
        
        if(aiResponse) {
            addMessage('cliente', aiResponse);
            fullTranscriptCliente.push(aiResponse);
            conversationHistory.push({ role: "assistant", content: aiResponse });
            speak(aiResponse);
        }
        document.getElementById('statusText').innerText = "Tu turno";
    }

    function addMessage(role, text) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerText = text;
        
        // Detectar quiebre visualmente
        if(role === 'asesor') {
            let label = null;
            if(RX_BP.askMonto.test(text)) label = 'Sondeo';
            else if(RX_BP.capital.test(text)) label = 'Oferta Capital';
            else if(RX_BP.cuotas.test(text)) label = 'Cuotas';
            else if(RX_BP.urg.test(text)) label = 'Urgencia';
            
            if(label) {
                const b = document.createElement('span');
                b.className = 'bp-badge'; b.innerText = label;
                div.appendChild(b);
            }
        }
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    /* OPENAI & TTS */
    async function fetchOpenAI(msgs) {
        if(apiKeys.length === 0) return "Error: Sin API Keys";
        const key = apiKeys[currentKeyIdx % apiKeys.length];
        try {
            const res = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                body: JSON.stringify({ model: "gpt-4o-mini", messages: msgs, max_tokens: 150, temperature: 0.7 })
            });
            const data = await res.json();
            return data.choices[0].message.content;
        } catch(e) {
            currentKeyIdx++; console.error(e); return "Problema de conexión con la IA.";
        }
    }

    function speak(text) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'es-ES'; u.rate = 1.1;
        window.speechSynthesis.speak(u);
    }

    /* EVALUACIÓN FINAL RESTAURADA (CRITICO.HTML LÓGICA) */
    async function finishSession() {
        if(recognition) recognition.stop();
        
        // Calcular Feedback detallado
        const scoreData = computeFeedback(fullTranscriptAsesor);
        
        // Guardar en BD Supabase
        await sbClient.from('sesiones_roleplay').insert([{
            usuario: user,
            escenario: scenarioData.titulo,
            puntaje_total: scoreData.totalScore,
            detalle_json: scoreData, // Guardamos todo el objeto JSON con fortalezas y mejoras
            feedback: "Sesión completada."
        }]);

        // Construir HTML del Modal con listas detalladas
        let html = `
            <div class="score-grid">
                <div class="score-card"><div>Nota Final</div><div class="score-val">${scoreData.totalScore}/100</div></div>
                <div class="score-card"><div>Saludo</div><div class="score-val">${scoreData.pts.saludo}/10</div></div>
                <div class="score-card"><div>Motivo</div><div class="score-val">${scoreData.pts.motivo}/30</div></div>
                <div class="score-card"><div>Negociación</div><div class="score-val">${scoreData.pts.negociacion}/60</div></div>
            </div>
            
            <h3 style="color:#166534; margin-bottom:10px">✅ Fortalezas</h3>
            <ul class="fb-list fb-good">
                ${scoreData.strengths.length ? scoreData.strengths.map(s => `<li>${s}</li>`).join('') : '<li>No se detectaron fortalezas clave.</li>'}
            </ul>

            <h3 style="color:#991b1b; margin-top:20px; margin-bottom:10px">⚠️ A Mejorar</h3>
            <ul class="fb-list fb-bad">
                ${scoreData.improvements.length ? scoreData.improvements.map(s => `<li>${s}</li>`).join('') : '<li>¡Excelente trabajo! Sin observaciones críticas.</li>'}
            </ul>
        `;
        
        document.getElementById('fbContent').innerHTML = html;
        document.getElementById('modalFeedback').style.display = 'flex';
    }

    /* LÓGICA DE CÁLCULO DE FEEDBACK (COMPLETA) */
    function computeFeedback(asesorMsgs) {
        const allText = asesorMsgs.join(' ').toLowerCase();
        let pts = { saludo: 0, motivo: 0, negociacion: 0 };
        let strengths = [], improvements = [];

        // 1. Saludo (10 pts)
        if(/(hola|buenos|tardes|noches)/.test(allText)) { pts.saludo += 5; strengths.push("Saludo inicial correcto."); }
        else improvements.push("Faltó saludar formalmente.");
        
        if(/(banco|entidad|financiera|dupree|natura)/.test(allText)) { pts.saludo += 5; strengths.push("Identificación de la entidad."); }
        else improvements.push("Debes mencionar de parte de quién llamas.");

        // 2. Motivo (30 pts)
        if(/(deuda|pendiente|pago|cancelar)/.test(allText)) { pts.motivo += 10; strengths.push("Claridad en el motivo de llamada."); }
        else improvements.push("No fuiste claro con el motivo de la deuda.");
        
        if(/\d+/.test(allText)) { pts.motivo += 10; strengths.push("Mención de montos/cifras."); }
        else improvements.push("Faltó mencionar montos específicos.");
        
        if(/(cu[áa]nto|monto|disponible|puedes)/.test(allText)) { pts.motivo += 10; strengths.push("Buen sondeo de capacidad de pago."); }
        else improvements.push("Debes sondear cuánto puede pagar el cliente.");

        // 3. Negociación (60 pts)
        if(/(beneficio|descuento|campaña|oportunidad)/.test(allText)) { pts.negociacion += 15; strengths.push("Uso de beneficios/campañas."); }
        else improvements.push("Ofrece beneficios o descuentos para persuadir.");
        
        if(/(hoy|mañana|24|48|horas)/.test(allText)) { pts.negociacion += 15; strengths.push("Sentido de urgencia aplicado."); }
        else improvements.push("Faltó aplicar sentido de urgencia (fechas límite).");
        
        if(/(ayudar|solucionar|apoyo|entiendo)/.test(allText)) { pts.negociacion += 15; strengths.push("Empatía y voluntad de ayuda."); }
        else improvements.push("Muestra más empatía con la situación del cliente.");
        
        if(/(capital|cuotas|total)/.test(allText)) { pts.negociacion += 15; strengths.push("Ofrecimiento de alternativas de pago."); }
        else improvements.push("Debes ofrecer opciones (Capital, Cuotas o Total).");

        const total = pts.saludo + pts.motivo + pts.negociacion;
        return { totalScore: total, pts: pts, strengths, improvements };
    }
  </script>
</body>
</html>
