<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geincos Academy | Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --surface: #ffffff;
            --bg-body: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-body);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: var(--surface);
            width: 100%;
            max-width: 1000px;
            height: 600px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* LEFT SIDE (IMAGE/BRAND) */
        .brand-side {
            flex: 1;
            background: linear-gradient(135deg, #4f46e5 0%, #818cf8 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .brand-side::before {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            top: -50px; left: -50px;
        }
        
        .brand-side h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; z-index: 10; }
        .brand-side p { font-size: 1.1rem; opacity: 0.9; z-index: 10; max-width: 300px; line-height: 1.6; }
        .brand-icon { font-size: 4rem; margin-bottom: 20px; z-index: 10; }

        /* RIGHT SIDE (FORMS) */
        .form-side {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .form-header { margin-bottom: 30px; }
        .form-header h2 { font-size: 1.8rem; font-weight: 800; color: var(--text-main); margin-bottom: 5px; }
        .form-header p { color: var(--text-muted); }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-field {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            background: #f8fafc;
        }
        .input-field:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        .btn-auth {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-auth:hover { background: var(--primary-dark); transform: translateY(-2px); }

        .toggle-text { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
        .toggle-text a { color: var(--primary); text-decoration: none; font-weight: 700; cursor: pointer; }

        /* ANIMACIONES ENTRE FORMS */
        .form-container { display: none; animation: fadeIn 0.4s ease; }
        .form-container.active { display: block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

        /* Responsive */
        @media (max-width: 768px) {
            .auth-container { flex-direction: column; height: auto; }
            .brand-side { padding: 30px; display: none; } /* Ocultar branding en móvil para simplificar */
            .form-side { padding: 30px; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-side">
            <i class="fas fa-graduation-cap brand-icon"></i>
            <h1>Geincos</h1>
            <p>Plataforma integral de capacitación, entrenamiento con IA y certificación profesional.</p>
        </div>

        <div class="form-side">
            
            <div id="loginForm" class="form-container active">
                <div class="form-header">
                    <h2>Bienvenido de nuevo</h2>
                    <p>Ingresa tus credenciales para continuar.</p>
                </div>
                <form onsubmit="event.preventDefault(); login();">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="logUser" class="input-field" placeholder="Usuario" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="logPass" class="input-field" placeholder="Contraseña" required>
                    </div>
                    <button type="submit" id="btnLogin" class="btn-auth">Iniciar Sesión</button>
                </form>
                <div class="toggle-text">
                    ¿No tienes cuenta? <a onclick="showRegister()">Regístrate aquí</a>
                </div>
            </div>

            <div id="registerForm" class="form-container">
                <div class="form-header">
                    <h2>Crear Cuenta</h2>
                    <p>Únete a nuestro equipo de talentos.</p>
                </div>
                <form onsubmit="event.preventDefault(); register();">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="regUser" class="input-field" placeholder="Crear Usuario (Ej: jsmith)" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-id-card"></i>
                        <input type="text" id="regDni" class="input-field" placeholder="DNI" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="text" id="regEmail" class="input-field" placeholder="Nombre Completo" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-user-tag"></i>
                        <select id="regRole" class="input-field" required>
                            <option value="" disabled selected>Soy...</option>
                            <option value="postulante">Postulante</option>
                            <option value="trabajador">Trabajador</option>
                            <option value="supervisor">Supervisor / Calidad</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regPass" class="input-field" placeholder="Crear Contraseña" required>
                    </div>
                    <button type="submit" id="btnRegister" class="btn-auth">Registrarse</button>
                </form>
                <div class="toggle-text">
                    ¿Ya tienes cuenta? <a onclick="showLogin()">Inicia Sesión</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        const SB_URL = 'https://xgvfcmadsprjyljtpooo.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndmZjbWFkc3ByanlsanRwb29vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1ODMxNjAsImV4cCI6MjA4MjE1OTE2MH0.XYBbKFE17PfyYMn2SNL5UJrCQmDRbimTQO0jpbX1Zd0';
        const sbClient = supabase.createClient(SB_URL, SB_KEY);

        function showRegister() {
            document.getElementById('loginForm').classList.remove('active');
            document.getElementById('registerForm').classList.add('active');
        }

        function showLogin() {
            document.getElementById('registerForm').classList.remove('active');
            document.getElementById('loginForm').classList.add('active');
        }

        async function login() {
            const btn = document.getElementById('btnLogin');
            const user = document.getElementById('logUser').value.trim();
            const pass = document.getElementById('logPass').value.trim();

            btn.innerText = "Verificando...";
            btn.disabled = true;

            try {
                // Verificar credenciales en tabla 'usuarios'
                const { data, error } = await sbClient
                    .from('usuarios')
                    .select('*')
                    .eq('usuario', user)
                    .eq('password', pass) // Nota: En producción usar hash, aquí es texto plano por simplicidad del prototipo
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    localStorage.setItem('usuarioActual', data.usuario);
                    localStorage.setItem('rolActual', data.rol || 'user');
                    
                    // LÓGICA DE REDIRECCIÓN ACTUALIZADA
                    if (data.rol === 'admin') {
                        window.location.href = 'panel-admin.html';
                    } else if (data.rol === 'supervisor') {
                        window.location.href = 'supervisores.html';
                    } else {
                        window.location.href = 'panel-usuario.html';
                    }
                } else {
                    alert('Usuario o contraseña incorrectos.');
                    btn.innerText = "Iniciar Sesión";
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Error de conexión.');
                console.error(err);
                btn.innerText = "Iniciar Sesión";
                btn.disabled = false;
            }
        }

        async function register() {
            const btn = document.getElementById('btnRegister');
            const user = document.getElementById('regUser').value.trim();
            const dni = document.getElementById('regDni').value.trim();
            const email = document.getElementById('regEmail').value.trim(); // Usado como Nombre Completo
            const pass = document.getElementById('regPass').value.trim();
            const type = document.getElementById('regRole').value; // postulante, trabajador, supervisor

            if(!type) return alert("Selecciona qué eres (Postulante, Trabajador o Supervisor).");

            btn.innerText = "Creando...";
            btn.disabled = true;

            try {
                // Verificar si existe
                const { data: exists } = await sbClient.from('usuarios').select('id').eq('usuario', user).maybeSingle();
                if (exists) {
                    alert('El usuario ya existe. Intenta con otro.');
                    btn.innerText = "Registrarse";
                    btn.disabled = false;
                    return;
                }

                // Determinar rol del sistema
                // Si elige "supervisor", el rol interno será 'supervisor'. Si no, será 'user' (o 'asesor').
                let systemRole = 'asesor';
                if (type === 'supervisor') systemRole = 'supervisor';

                // Insertar
                const { error } = await sbClient.from('usuarios').insert([{
                    usuario: user,
                    password: pass,
                    dni: dni,
                    correo: email, // Guardamos Nombre Completo en campo correo
                    tipo: type,    // postulante, trabajador, supervisor
                    rol: systemRole, // admin, supervisor, asesor
                    etiqueta: 'General', // Grupo por defecto
                    estado_capacitacion: 'En Curso'
                }]);

                if (error) throw error;

                alert('Cuenta creada con éxito. Inicia sesión.');
                showLogin();

            } catch (err) {
                alert('Error al registrar.');
                console.error(err);
            } finally {
                btn.innerText = "Registrarse";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
