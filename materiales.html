<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Geincos Admin | Materiales por Carpetas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --primary: #4f46e5; --bg-body: #f3f4f6; --surface: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; flex-shrink: 0; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .brand span { font-size: 1.25rem; font-weight: 800; }
        .menu-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin: 20px 0 10px 10px; }
        .menu-item { padding: 12px 16px; color: var(--text-muted); border-radius: 8px; cursor: pointer; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .menu-item:hover { background: #eef2ff; color: var(--primary); }
        .menu-item.active { background: var(--primary); color: white; }

        .main-content { flex: 1; padding: 32px; overflow-y: auto; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; margin-bottom: 25px; align-items: center; }
        
        /* DISEÑO DE CARPETAS */
        .grid-folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .folder-card { background: white; padding: 20px; border-radius: 16px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
        .folder-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .folder-icon { font-size: 3rem; color: #facc15; }
        .folder-name { font-weight: 700; color: var(--text-main); }
        .folder-count { font-size: 0.75rem; color: var(--text-muted); }

        /* TABLA DE ARCHIVOS */
        .breadcrumb { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-weight: 600; color: var(--text-muted); }
        .btn-back { background: none; border: none; cursor: pointer; color: var(--primary); font-size: 1.1rem; }
        .table-container { background: white; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px 20px; background: #f8fafc; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
        td { padding: 15px 20px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }

        .btn-primary { background: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .btn-icon { width: 32px; height: 32px; border-radius: 6px; border: none; cursor: pointer; color: white; margin-right: 5px; }

        /* MODALES */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.6); z-index: 1000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-box { background: white; width: 600px; padding: 30px; border-radius: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .file-input-wrapper { border: 2px dashed #cbd5e1; padding: 20px; text-align: center; border-radius: 10px; position: relative; }
        .file-input-wrapper input { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><span>Geincos Admin</span></div>
        <div class="menu-label">Analítica</div>
        <a href="dashboard.html" class="menu-item"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="reportes.html" class="menu-item"><i class="fas fa-file-invoice"></i> Reportes</a>
        <div class="menu-label">Gestión</div>
        <a href="postulantes.html" class="menu-item"><i class="fas fa-users"></i> Postulantes</a>
        <a href="personal-activo.html" class="menu-item"><i class="fas fa-id-badge"></i> Personal Activo</a>
        <a href="asistencia.html" class="menu-item"><i class="fas fa-calendar-check"></i> Asistencia</a>
        <a href="materiales.html" class="menu-item active"><i class="fas fa-book"></i> Materiales</a>
        <a href="examenes.html" class="menu-item"><i class="fas fa-clipboard-check"></i> Exámenes</a>
        <a href="simuladores.html" class="menu-item"><i class="fas fa-gamepad"></i> Simuladores</a>
        <a href="ia-roleplay.html" class="menu-item"><i class="fas fa-robot"></i> IA Roleplay</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h2 id="mainTitle">Módulos de Capacitación</h2>
            <button class="btn-primary" onclick="openModal('modalCourse', 'create')">+ Nuevo Material</button>
        </div>

        <div id="viewFolders" class="grid-folders"></div>

        <div id="viewFiles" style="display:none">
            <div class="breadcrumb">
                <button class="btn-back" onclick="showFolders()"><i class="fas fa-chevron-left"></i> Volver a Módulos</button>
                <span>/</span>
                <span id="currentFolderName" style="color:var(--primary)">Nombre</span>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Título</th><th>Tipo</th><th>Acciones</th></tr></thead>
                    <tbody id="tbFiles"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalCourse">
        <div class="modal-box">
            <h3>Gestión de Material</h3>
            <input type="hidden" id="cId">
            <div class="form-group"><label>Módulo</label><input id="cMod" class="form-control" placeholder="Ej: Negociación"></div>
            <div class="form-group"><label>Título</label><input id="cTitle" class="form-control"></div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="cType" class="form-control" onchange="toggleFields()">
                    <option value="video">Video</option>
                    <option value="pdf">Documento PDF</option>
                    <option value="imagen">Imagen</option>
                    <option value="examen">Vincular Examen</option>
                </select>
            </div>
            <div class="form-group" id="divUrl"><label>URL / Enlace</label><input id="cUrl" class="form-control"></div>
            <div class="form-group" id="divFile">
                <label>Archivo Local</label>
                <div class="file-input-wrapper">
                    <span id="fnDisplay">Clic para subir</span>
                    <input type="file" id="cFile" onchange="document.getElementById('fnDisplay').innerText=this.files[0].name">
                </div>
            </div>
            <div style="text-align:right; margin-top:20px">
                <button class="btn-primary" style="background:#64748b" onclick="closeModals()">Cancelar</button>
                <button id="btnSave" class="btn-primary" onclick="saveCourse()" style="display:inline-flex;margin-left:10px">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://xgvfcmadsprjyljtpooo.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndmZjbWFkc3ByanlsanRwb29vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1ODMxNjAsImV4cCI6MjA4MjE1OTE2MH0.XYBbKFE17PfyYMn2SNL5UJrCQmDRbimTQO0jpbX1Zd0';
        const sbClient = supabase.createClient(SB_URL, SB_KEY);
        
        let allData = [], currentModule = null;

        window.onload = loadData;

        async function loadData() {
            const { data } = await sbClient.from('cursos').select('*').neq('tipo','simulador').order('modulo');
            allData = data || [];
            renderFolders();
        }

        function renderFolders() {
            const modules = [...new Set(allData.map(item => item.modulo))];
            let h = '';
            modules.forEach(m => {
                const count = allData.filter(i => i.modulo === m).length;
                h += `<div class="folder-card" onclick="openFolder('${m}')">
                        <i class="fas fa-folder folder-icon"></i>
                        <div class="folder-name">${m}</div>
                        <div class="folder-count">${count} archivos</div>
                    </div>`;
            });
            document.getElementById('viewFolders').innerHTML = h;
            document.getElementById('viewFolders').style.display = 'grid';
            document.getElementById('viewFiles').style.display = 'none';
            document.getElementById('mainTitle').innerText = "Módulos de Capacitación";
            currentModule = null;
        }

        function openFolder(m) {
            currentModule = m;
            document.getElementById('viewFolders').style.display = 'none';
            document.getElementById('viewFiles').style.display = 'block';
            document.getElementById('currentFolderName').innerText = m;
            document.getElementById('mainTitle').innerText = "Contenido del Módulo";
            
            const files = allData.filter(i => i.modulo === m);
            let h = '';
            files.forEach(f => {
                h += `<tr>
                        <td><b>${f.titulo}</b></td>
                        <td>${f.tipo.toUpperCase()}</td>
                        <td>
                            <button class="btn-icon" style="background:var(--warning)" onclick="editCourse('${f.id}')"><i class="fas fa-pen"></i></button>
                            <button class="btn-icon" style="background:var(--danger)" onclick="delCourse('${f.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
            document.getElementById('tbFiles').innerHTML = h || '<tr><td colspan="3" style="text-align:center">Carpeta vacía</td></tr>';
        }

        function showFolders() { renderFolders(); }

        function openModal(id, mode) {
            document.getElementById(id).style.display = 'flex';
            if (mode === 'create') {
                clearForm();
                // REGLA DE ORO: Si estoy en una carpeta, autocompletar el módulo
                if (currentModule) document.getElementById('cMod').value = currentModule;
            }
        }

        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m=>m.style.display='none'); }

        function toggleFields() {
            const t = document.getElementById('cType').value;
            document.getElementById('divUrl').style.display = (t === 'examen') ? 'none' : 'block';
            document.getElementById('divFile').style.display = (t === 'examen') ? 'none' : 'block';
        }

        async function saveCourse() {
            const btn = document.getElementById('btnSave');
            btn.innerText = "Guardando..."; btn.disabled = true;
            try {
                const id = document.getElementById('cId').value;
                const fileInput = document.getElementById('cFile');
                let urlFinal = document.getElementById('cUrl').value;

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileName = Date.now() + '_' + file.name;
                    await sbClient.storage.from('materiales').upload(fileName, file);
                    const { data: pub } = sbClient.storage.from('materiales').getPublicUrl(fileName);
                    urlFinal = pub.publicUrl;
                }

                const payload = {
                    modulo: document.getElementById('cMod').value,
                    titulo: document.getElementById('cTitle').value,
                    tipo: document.getElementById('cType').value,
                    video: urlFinal
                };

                if (id) await sbClient.from('cursos').update(payload).eq('id', id);
                else await sbClient.from('cursos').insert([payload]);

                closeModals();
                await loadData();
                if (currentModule) openFolder(currentModule);
                else renderFolders();
            } catch (e) { alert(e.message); }
            finally { btn.innerText = "Guardar"; btn.disabled = false; }
        }

        async function editCourse(id) {
            const { data } = await sbClient.from('cursos').select('*').eq('id', id).single();
            if (data) {
                document.getElementById('cId').value = data.id;
                document.getElementById('cMod').value = data.modulo;
                document.getElementById('cTitle').value = data.titulo;
                document.getElementById('cType').value = data.tipo;
                document.getElementById('cUrl').value = data.video || '';
                toggleFields();
                openModal('modalCourse');
            }
        }

        async function delCourse(id) {
            if (confirm('¿Eliminar?')) {
                await sbClient.from('cursos').delete().eq('id', id);
                await loadData();
                if (currentModule) openFolder(currentModule);
            }
        }

        function clearForm() { 
            document.getElementById('cId').value = ''; 
            document.getElementById('cMod').value = ''; 
            document.getElementById('cTitle').value = ''; 
            document.getElementById('cUrl').value = ''; 
            document.getElementById('fnDisplay').innerText = 'Clic para subir';
        }
    </script>
</body>
</html>
